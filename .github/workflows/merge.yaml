name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'authentication/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'authentication/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  # Job to check which parts of the monorepo have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'authentication/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/workflows/**'

  build:
    name: Auth Build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.workflows == 'true'
    strategy:
      matrix:
        java-version: [21, 25]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'authentication/build.gradle'
      
      - name: Grant execute permission for gradlew
        working-directory: ./authentication
        run: chmod +x gradlew
      
      - name: Build (excluding tests)
        working-directory: ./authentication
        run: ./gradlew build -x test
      
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-build-reports-${{ matrix.java-version }}
          path: authentication/build/reports/

  test:
    name: Auth Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        java-version: [21, 25]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'authentication/build.gradle'
      
      - name: Grant execute permission for gradlew
        working-directory: ./authentication
        run: chmod +x gradlew
      
      - name: Run tests
        working-directory: ./authentication
        run: ./gradlew test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-results-${{ matrix.java-version }}
          path: authentication/build/reports/tests/test/
